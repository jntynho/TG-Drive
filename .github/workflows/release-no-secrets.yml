name: Release APK (no secrets)

on:
  push:
    branches: [main]
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number, e.g. 0.2.0'
        required: true
        default: '0.2.0'
      publish:
        description: 'Create a GitHub release with the APK'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-nosecrets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  device-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test optional sharing service
        run: npm test --prefix sharing-server
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run native device smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: bash scripts/run_device_checks.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/

  build:
    needs: device-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INPUT_VERSION: ${{ inputs.version }}
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
      KS_PASS: tgdrive-sideload-key
      APP_VERSION_CODE: ${{ github.run_number }}
      RESTORE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RESTORE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RESTORE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RESTORE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - uses: gradle/actions/setup-gradle@v4

      - name: Set version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${INPUT_VERSION:-0.2.0}"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] || { echo "Invalid version: $version"; exit 1; }
          echo "APP_VERSION_NAME=$version" >> "$GITHUB_ENV"

      - name: Restore signing key
        id: keycache
        uses: actions/cache@v4
        with:
          path: ~/.tgdrive-signing
          key: tgdrive-sideload-signing-key-v1

      - name: Configure existing signing identity
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$RESTORE_KEYSTORE_B64" ]]; then
            : "${RESTORE_STORE_PASSWORD:?Set RELEASE_STORE_PASSWORD}"
            : "${RESTORE_KEY_ALIAS:?Set RELEASE_KEY_ALIAS}"
            : "${RESTORE_KEY_PASSWORD:?Set RELEASE_KEY_PASSWORD}"
            mkdir -p "$RUNNER_TEMP/tgdrive-signing"
            keyfile="$RUNNER_TEMP/tgdrive-signing/release.jks"
            printf '%s' "$RESTORE_KEYSTORE_B64" | base64 --decode > "$keyfile"
            chmod 600 "$keyfile"
            {
              echo "RELEASE_STORE_FILE=$keyfile"
              echo "RELEASE_STORE_PASSWORD=$RESTORE_STORE_PASSWORD"
              echo "RELEASE_KEY_ALIAS=$RESTORE_KEY_ALIAS"
              echo "RELEASE_KEY_PASSWORD=$RESTORE_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            keyfile="$HOME/.tgdrive-signing/release.jks"
            [[ -s "$keyfile" ]] || { echo 'The existing signing key is unavailable. Restore its backup through RELEASE_KEYSTORE_BASE64 and signing secrets. Refusing to generate a different key for installed users.'; exit 1; }
            {
              echo "RELEASE_STORE_FILE=$keyfile"
              echo "RELEASE_STORE_PASSWORD=$KS_PASS"
              echo "RELEASE_KEY_ALIAS=tgdrive"
              echo "RELEASE_KEY_PASSWORD=$KS_PASS"
            } >> "$GITHUB_ENV"
          fi

      - name: Test library recovery, lint and build release APK/AAB
        run: ./gradlew --no-daemon --max-workers=2 testReleaseUnitTest lintRelease assembleRelease bundleRelease

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports
          path: |
            app/build/reports/
            app/build/test-results/

      - name: Verify APK signature and alignment
        shell: bash
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/36.0.0"
          for apk in app/build/outputs/apk/release/*.apk; do
            "$tools/zipalign" -c -P 16 4 "$apk"
            "$tools/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/apk-signature.txt"
            actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-signature.txt")"
            expected="$(tr -d '\r\n ' < scripts/sideload-cert-sha256.txt)"
            [[ "$actual" == "$expected" ]] || { echo 'Signing certificate changed: this APK would not update 0.1.1 in place.'; exit 1; }
          done
          python3 scripts/check_native_alignment.py app/build/outputs/apk/release/*.apk

      - name: Collect files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/tg-drive-${APP_VERSION_NAME}.apk"
          cp app/build/outputs/bundle/release/*.aab "dist/tg-drive-${APP_VERSION_NAME}.aab"
          cp app/build/outputs/mapping/release/mapping.txt dist/
          (cd dist && sha256sum *.apk *.aab > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: tg-drive-release
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub release
        if: env.PUBLISH == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="v${APP_VERSION_NAME}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            target_args=(--verify-tag)
          else
            target_args=(--target "$GITHUB_SHA")
          fi
          gh release create "$tag" dist/*.apk dist/*.aab dist/SHA256SUMS \
            "${target_args[@]}" \
            --title "TG Drive $tag" \
            --generate-notes \
            --prerelease
