name: Release APK (no secrets)

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number, e.g. 0.1.0'
        required: true
        default: '0.1.0'
      publish:
        description: 'Create a GitHub release with the APK'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-nosecrets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INPUT_VERSION: ${{ inputs.version }}
      PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
      KS_PASS: tgdrive-sideload-key
      APP_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Set version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$INPUT_VERSION"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] || { echo "Invalid version: $version"; exit 1; }
          echo "APP_VERSION_NAME=$version" >> "$GITHUB_ENV"

      - name: Restore signing key
        id: keycache
        uses: actions/cache@v4
        with:
          path: ~/.tgdrive-signing
          key: tgdrive-sideload-signing-key-v1

      - name: Create signing key (first run only)
        if: steps.keycache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.tgdrive-signing"
          keytool -genkeypair \
            -keystore "$HOME/.tgdrive-signing/release.jks" \
            -storetype PKCS12 \
            -storepass "$KS_PASS" -keypass "$KS_PASS" \
            -alias tgdrive -keyalg RSA -keysize 4096 -validity 10000 \
            -dname "CN=TG Drive Sideload"

      - name: Configure signing
        shell: bash
        run: |
          {
            echo "RELEASE_STORE_FILE=$HOME/.tgdrive-signing/release.jks"
            echo "RELEASE_STORE_PASSWORD=$KS_PASS"
            echo "RELEASE_KEY_ALIAS=tgdrive"
            echo "RELEASE_KEY_PASSWORD=$KS_PASS"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify APK signature and alignment
        shell: bash
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/36.0.0"
          for apk in app/build/outputs/apk/release/*.apk; do
            "$tools/zipalign" -c -P 16 4 "$apk"
            "$tools/apksigner" verify --verbose "$apk"
          done
          python3 scripts/check_native_alignment.py app/build/outputs/apk/release/*.apk

      - name: Collect files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/tg-drive-${APP_VERSION_NAME}.apk"
          cp app/build/outputs/mapping/release/mapping.txt dist/ || true
          (cd dist && sha256sum *.apk > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: tg-drive-release
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub release
        if: env.PUBLISH == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="v${APP_VERSION_NAME}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            target_args=(--verify-tag)
          else
            target_args=(--target "$GITHUB_SHA")
          fi
          gh release create "$tag" dist/*.apk dist/SHA256SUMS \
            "${target_args[@]}" \
            --title "TG Drive $tag" \
            --generate-notes \
            --prerelease
